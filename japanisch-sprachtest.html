<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Japanische Sprachausgabe – Test</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#15222c;background:#f4f6f7}*{box-sizing:border-box}body{margin:0;padding:24px 16px}main{max-width:500px;margin:40px auto;background:white;border:1px solid #dfe5e8;border-radius:16px;padding:26px 20px;text-align:center}h1{font-size:21px;margin:0 0 18px}.jp{font-size:32px;margin:12px 0 4px}.roman{color:#667480;margin:0 0 22px}button{border:0;border-radius:11px;padding:14px 20px;background:#15222c;color:white;font:600 16px system-ui;cursor:pointer;width:100%}button:disabled{opacity:.5}p#status{font-size:14px;color:#667480;min-height:42px;line-height:1.5}small{color:#667480;line-height:1.5;display:block}</style></head><body><main><h1>Japanische Sprachausgabe testen</h1><div class="jp" lang="ja">お疲れ様でした</div><p class="roman">Otsukaresama deshita</p><button id="play" type="button">▶ Aussprache abspielen</button><p id="status" role="status" aria-live="polite">Tippe auf den Knopf, um die japanische Stimme zu testen.</p><small>Dieser Test verändert deinen Kata-Trainer nicht. Er verwendet die Sprachausgabe deines Geräts und benötigt keine Audiodatei.</small></main><script>
(function(){'use strict';const button=document.getElementById('play'),status=document.getElementById('status');const speech=window.speechSynthesis;let voices=[];function updateVoices(){try{voices=speech?speech.getVoices():[]}catch(e){voices=[]}}if(speech){updateVoices();speech.addEventListener?.('voiceschanged',updateVoices)}if(!speech||!window.SpeechSynthesisUtterance){button.disabled=true;status.textContent='Dieses Gerät bzw. dieser Browser unterstützt die Sprachausgabe nicht.';return}button.addEventListener('click',function(){try{speech.cancel();updateVoices();const japanese=voices.filter(v=>/^ja(?:-|$)/i.test(v.lang));if(!japanese.length){status.textContent='Keine japanische Stimme gefunden. Bitte prüfe, ob eine japanische Systemstimme installiert ist.';return}const u=new SpeechSynthesisUtterance('お疲れ様でした');u.lang='ja-JP';u.voice=japanese.find(v=>v.localService)||japanese[0];u.rate=.85;u.pitch=1;u.volume=1;u.onstart=()=>{status.textContent='Sprachausgabe läuft: '+u.voice.name};u.onend=()=>{status.textContent='Wiedergabe beendet. Stimme: '+u.voice.name};u.onerror=(e)=>{status.textContent='Sprachausgabe konnte nicht gestartet werden ('+(e.error||'unbekannter Fehler')+'). Der Test bleibt weiterhin bedienbar.'};status.textContent='Starte japanische Sprachausgabe …';speech.speak(u)}catch(e){status.textContent='Sprachausgabe ist auf diesem Gerät momentan nicht verfügbar.'}})})();
</script></body></html>
